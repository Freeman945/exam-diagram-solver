name: test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  python-engine:
    name: Python engine (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate JSON schemas
        run: python -c "import json, glob; [json.load(open(p, encoding='utf-8')) for p in glob.glob('schemas/*.json')]; print('schemas ok')"
      - name: Compile check
        run: python -m compileall -q python
      - name: Unit, schema, renderer and benchmark tests
        run: python -m pytest tests/python -q

  node-host:
    name: Node host layer (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check
        run: |
          for f in index.js lib/*.js scripts/*.mjs tests/node/*.mjs; do
            node --check "$f"
          done
      - name: Unit and benchmark tests
        run: node scripts/run-node-tests.mjs

  plugin-smoke:
    name: Plugin wiring smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Load the plugin with a stub context
        run: node scripts/smoke-engine.mjs
